<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | EKOTTAM Livestock</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #1A3A1C;
            --color-sec: #122814;
            --color-accent: #C9951A;
            --color-accent-light: #e0ac2c;
            --color-bg: #FDF6E3;
            --color-light: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-sec) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Decorative background blobs */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: var(--color-accent);
            opacity: 0.08;
            filter: blur(80px);
        }
        body::before { top: -120px; left: -120px; }
        body::after { bottom: -120px; right: -120px; }

        .card {
            background: var(--color-light);
            border-radius: 24px;
            padding: 3.5rem 3rem;
            max-width: 520px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animated checkmark */
        .checkmark-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            margin: 0 auto 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.5s ease 0.3s both;
        }

        @keyframes popIn {
            from { transform: scale(0); }
            60% { transform: scale(1.15); }
            to { transform: scale(1); }
        }

        .checkmark-circle svg {
            width: 44px;
            height: 44px;
            stroke: var(--color-light);
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .check-path {
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: drawCheck 0.4s ease 0.7s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--color-primary);
            font-size: 2rem;
            margin-bottom: 0.8rem;
        }

        .subtitle {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .highlight {
            color: var(--color-accent);
            font-weight: 600;
        }

        /* Progress bar for auto-redirect */
        .redirect-info {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 1rem;
        }

        .progress-bar-track {
            width: 100%;
            height: 4px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1.8rem;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-accent), var(--color-accent-light));
            border-radius: 4px;
            animation: fillBar 8s linear forwards;
        }

        @keyframes fillBar {
            from { width: 0%; }
            to { width: 100%; }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--color-accent);
            color: var(--color-light);
        }

        .btn-primary:hover {
            background-color: var(--color-accent-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(201, 149, 26, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
            margin-left: 0.8rem;
        }

        .btn-secondary:hover {
            background: var(--color-primary);
            color: var(--color-light);
            transform: translateY(-2px);
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .contact-note {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
            font-size: 0.85rem;
            color: #999;
        }

        .contact-note a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .card { padding: 2.5rem 1.5rem; }
            h1 { font-size: 1.6rem; }
            .buttons { flex-direction: column; }
            .btn-secondary { margin-left: 0; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="checkmark-circle">
            <svg viewBox="0 0 44 44">
                <polyline class="check-path" points="12 22 20 30 32 14" />
            </svg>
        </div>

        <h1>Thank You! 🎉</h1>
        <p class="subtitle">
            Your details have been submitted successfully.<br>
            Our team will reach out to you <span class="highlight">within 24 hours</span>.
        </p>

        <p class="redirect-info">Redirecting to homepage in <span id="countdown">8</span> seconds...</p>
        <div class="progress-bar-track">
            <div class="progress-bar-fill"></div>
        </div>

        <div class="buttons">
            <a href="index.html" class="btn btn-primary">← Back to Home</a>
            <a href="https://wa.me/919391609598" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">💬 WhatsApp Us</a>
        </div>

        <p class="contact-note">
            Need immediate help? Call us at <a href="tel:+919391609598">+91 93916 09598</a>
        </p>
    </div>

    <script>
        // Countdown timer
        let seconds = 8;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>
